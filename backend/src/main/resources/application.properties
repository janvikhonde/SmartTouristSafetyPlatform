spring.application.name=tourist-safety-system
spring.config.import=optional:file:./application-local.properties
# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8080}


# =========================================================
# MYSQL DATABASE
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/safetrail_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# JWT CONFIGURATION
# =========================================================
# Local fallback prevents startup failure when JWT_SECRET
# is not defined in the environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# CORS
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


# =========================================================
# WEBSOCKET
# =========================================================
app.websocket.endpoint=/ws
app.websocket.topic.locations=/topic/locations
app.websocket.topic.alerts=/topic/alerts


# =========================================================
# GEOFENCE
# =========================================================
app.geofence.check-interval=10000


# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO